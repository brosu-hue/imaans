name: Test, build the APK, publish the site

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Nothing is published unless the app actually signs a document correctly.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fixtures
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: /tmp/inksign-shots
          if-no-files-found: ignore

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The phone shows whoever signed the APK as its developer. A key stored in
      # repository secrets keeps that identity stable, so new builds install over
      # the old one; without it a fresh key is made each time, which still says
      # Rasuul but counts as a different app to Android.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > inksign.keystore
            echo "INKSIGN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INKSIGN_KEY_ALIAS=${KEY_ALIAS:-rasuul}" >> "$GITHUB_ENV"
            echo "Signing with the stored key."
          else
            keytool -genkeypair -v -keystore inksign.keystore -alias rasuul \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass inksign -keypass inksign \
              -dname "CN=Rasuul, O=Rasuul"
            echo "INKSIGN_KEYSTORE_PASSWORD=inksign" >> "$GITHUB_ENV"
            echo "INKSIGN_KEY_ALIAS=rasuul" >> "$GITHUB_ENV"
            {
              echo "### Heads up about updating"
              echo ""
              echo "No stored signing key, so this build made a new one. The APK says"
              echo "Rasuul, but Android treats each build as a different app: uninstall"
              echo "the previous one before installing this."
              echo ""
              echo "Adding the repository secrets \`ANDROID_KEYSTORE_BASE64\` and"
              echo "\`ANDROID_KEYSTORE_PASSWORD\` makes future builds install over the top."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "INKSIGN_KEYSTORE=$PWD/inksign.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check the web app really made it into the APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "built: $APK"
          for f in assets/www/index.html assets/www/js/app.js assets/www/vendor/pdf.min.mjs; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          mkdir -p out && cp "$APK" out/InkSign.apk
          ls -la out

      # The developer a phone shows is the owner of the signing certificate.
      # apksigner, not keytool: this APK carries only v2/v3 signatures, which
      # keytool -printcert -jarfile cannot read at all.
      - name: Check the APK is signed as Rasuul
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found under $SDK"; exit 1; }

          CERTS=$("$APKSIGNER" verify --print-certs out/InkSign.apk)
          echo "$CERTS"
          DN=$(echo "$CERTS" | grep -m1 'certificate DN:')
          echo "$DN" | grep -q 'CN=Rasuul' \
            || { echo "::error::the APK is not signed as Rasuul -- $DN"; exit 1; }
          {
            echo "### Developer"
            echo ""
            echo '```'
            echo "$DN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: InkSign-apk
          path: out/InkSign.apk
          if-no-files-found: error

      # A plain download link, so a phone can fetch it without signing in.
      - name: Publish as the latest build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "InkSign - latest build" \
              --notes "The newest Android build. It is self-signed, so Android will warn that it comes from an unknown developer - that is normal for an app you install yourself."
          gh release upload apk-latest out/InkSign.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/InkSign.apk" >> "$GITHUB_STEP_SUMMARY"

  # Publishing the website needs Pages switched on once by a repository admin
  # (Settings -> Pages -> Source: GitHub Actions). The build token is not
  # allowed to do that itself, so this job explains rather than fails the run.
  site:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### The website was not published"
            echo ""
            echo "GitHub Pages is not switched on for this repository yet, and the build"
            echo "token is not allowed to switch it on."
            echo ""
            echo "Go to **Settings -> Pages**, set **Source** to **GitHub Actions**, then"
            echo "re-run this workflow. After that the app is live at:"
            echo ""
            echo "https://$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1).github.io/$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)/"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Website not published: switch Pages on under Settings -> Pages."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
