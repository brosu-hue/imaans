plugins { id 'com.android.application' }

/*
 * The web app in ../../www is the single source of truth for both the website
 * and this APK. It is bundled into the APK's assets at build time rather than
 * copied into this folder, so the two can never drift apart.
 */
abstract class BundleWebApp extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getWebRoot()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject abstract FileSystemOperations getFs()

    @TaskAction
    void bundle() {
        fs.sync {
            from webRoot
            into outputDir.dir("www")
        }
    }
}

def bundleWebApp = tasks.register('bundleWebApp', BundleWebApp) {
    webRoot.set(file("$rootDir/../www"))
}

/*
 * Who the phone reports as the developer comes from the certificate the APK is
 * signed with, so the build uses a key whose owner is Rasuul rather than the
 * anonymous "Android Debug" key.
 *
 * The key itself is never kept in this repository. A build supplies it through
 * INKSIGN_KEYSTORE (and its passwords); without one, the build falls back to
 * the debug key and the APK is unsigned as far as identity goes.
 */
def keystorePath = System.getenv('INKSIGN_KEYSTORE')
def keystore = keystorePath ? file(keystorePath) : file('inksign.keystore')
def hasKeystore = keystore.exists()

android {
    namespace 'com.rasuul.inksign'
    compileSdk 35

    defaultConfig {
        applicationId "com.rasuul.inksign"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        rasuul {
            if (hasKeystore) {
                storeFile keystore
                storePassword System.getenv('INKSIGN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('INKSIGN_KEY_ALIAS') ?: 'rasuul'
                keyPassword System.getenv('INKSIGN_KEY_PASSWORD')
                        ?: System.getenv('INKSIGN_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A sideloaded personal build, not a Play Store release.
            signingConfig hasKeystore ? signingConfigs.rasuul : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Registers the bundled web app as an asset source, so Gradle wires the
// task dependency itself instead of us hoping the copy ran first.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(bundleWebApp, BundleWebApp::getOutputDir)
    }
}

dependencies {
    // The AndroidX libraries below pull in mismatched Kotlin standard library
    // versions. Since Kotlin 1.8 the -jdk7 and -jdk8 artifacts were folded into
    // the main one, so an older -jdk8 alongside a newer stdlib means the same
    // classes twice and the build fails. The BOM pins them all to one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
